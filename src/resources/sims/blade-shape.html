<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<aside id="panel">
  <p class="eyebrow">AE203 EP1: Manufacturing</p>
  <h1>Turbine blade shape</h1>
  <p class="lede">A blade is a stack of airfoil sections. Two parameters shape the section; three set how it tapers and twists along the span.</p>
  <div class="inset"><svg id="section" viewBox="0 0 268 110" role="img" aria-label="Root section"></svg></div>
  <p class="inset-label">Root section, camber line dashed</p>
  <div id="sliders"></div>
  <label class="chk"><input type="checkbox" id="rings" checked> Show the sections</label>
  <div class="btns"><button id="fit">Fit view</button><button id="reset">Reset shape</button></div>
  <div class="meta" id="meta"></div>
  <footer class="credit">AIM Group, Imperial College London · <a href="/teaching/#ae203">AE203</a></footer>
  <div class="qr"><svg id="qr" role="img" aria-label="QR code of this page's address"></svg></div>
</aside>
<div id="view"><div id="err" role="alert"></div></div>
<button id="toggle" aria-controls="panel" aria-expanded="false">Controls</button>
<script>
// On narrow screens the panel starts open; the button then closes it.
if (matchMedia('(max-width:720px)').matches) { document.getElementById('panel').classList.add('open'); var _t = document.getElementById('toggle'); _t.textContent = 'Close'; _t.setAttribute('aria-expanded', 'true'); }
</script>

<script src="qr.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- the five parameters ----------
const CHORD = 42;                       // root chord, mm (fixed)
const PARAMS = [
  { k: 'camber', label: 'Camber angle',        unit: '°',        min: 20, max: 110, step: 1,    def: 75 },
  { k: 'thick',  label: 'Max thickness',       unit: '% chord',  min: 4,  max: 24,  step: 0.5,  def: 17 },
  { k: 'twist',  label: 'Twist, root to tip',  unit: '°',        min: 0,  max: 45,  step: 1,    def: 20 },
  { k: 'taper',  label: 'Tip chord',           unit: '% of root', min: 40, max: 100, step: 1,   def: 86 },
  { k: 'span',   label: 'Span',                unit: '× chord',  min: 1,  max: 3,   step: 0.05, def: 1.85 },
];
const P = Object.fromEntries(PARAMS.map((p) => [p.k, p.def]));

// ---------- one section: circular-arc camber line, NACA-style thickness ----------
// Returns a closed ring of [x, z] points, leading edge first, centred on its
// centroid and rotated by the stagger angle.
function section(chord, tc, camberDeg, staggerDeg, n = 40) {
  const d = camberDeg * Math.PI / 180, R = chord / (2 * Math.sin(d / 2)), h = R * (1 - Math.cos(d / 2));
  const up = [], lo = [], cam = [];
  for (let i = 0; i < n; i++) {
    const s = i / (n - 1), phi = -d / 2 + s * d;
    const cx = chord / 2 + R * Math.sin(phi), cz = R * Math.cos(phi) - (R - h);
    const t = tc * chord * 5 * (0.2969 * Math.sqrt(s) - 0.1260 * s - 0.3516 * s * s + 0.2843 * s ** 3 - 0.1036 * s ** 4);
    up.push([cx + Math.sin(phi) * t / 2, cz + Math.cos(phi) * t / 2]);
    lo.push([cx - Math.sin(phi) * t / 2, cz - Math.cos(phi) * t / 2]);
    cam.push([cx, cz]);
  }
  const ring = up.slice(0, n - 1).concat(lo.slice().reverse().slice(0, n - 1));
  // centroid of the polygon, then rotate about it
  let A = 0, cxs = 0, czs = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x0, z0] = ring[i], [x1, z1] = ring[(i + 1) % ring.length], w = x0 * z1 - x1 * z0;
    A += w; cxs += (x0 + x1) * w; czs += (z0 + z1) * w;
  }
  const c = [cxs / (3 * A), czs / (3 * A)], a = staggerDeg * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
  const rot = ([x, z]) => [(x - c[0]) * cs - (z - c[1]) * sn, (x - c[0]) * sn + (z - c[1]) * cs];
  return { ring: ring.map(rot), camber: cam.map(rot), sagitta: h };
}

// ---------- the blade: sections lofted along the span ----------
const K = 36;
function sections() {
  const span = P.span * CHORD, out = [];
  for (let k = 0; k < K; k++) {
    const u = k / (K - 1);
    out.push({ y: u * span, ...section(CHORD * (1 - (1 - P.taper / 100) * u), P.thick / 100, P.camber, -P.twist * u) });
  }
  return out;
}
function bladeGeometry(secs) {
  const n = secs[0].ring.length, pos = [], idx = [];
  secs.forEach((s) => s.ring.forEach(([x, z]) => pos.push(x, s.y, z)));
  for (let k = 0; k < K - 1; k++) for (let j = 0; j < n; j++) {
    const a = k * n + j, b = k * n + (j + 1) % n, c = a + n, d = b + n;
    idx.push(a, b, c, b, d, c);
  }
  // caps: the root and tip rings triangulated in their own plane, on their own
  // copies of the ring vertices so the rim shades as a hard edge
  const cap = (k, flip) => {
    const base = pos.length / 3;
    secs[k].ring.forEach(([x, z]) => pos.push(x, secs[k].y, z));
    THREE.ShapeUtils.triangulateShape(secs[k].ring.map(([x, z]) => new THREE.Vector2(x, z)), [])
      .forEach(([a, b, c]) => idx.push(base + a, base + (flip ? c : b), base + (flip ? b : c)));
  };
  cap(0, false); cap(K - 1, true);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  // the ring runs clockwise seen from above, so flip everything if the side normals point inward
  const nrm = g.getAttribute('normal'), p0 = new THREE.Vector3().fromBufferAttribute(g.getAttribute('position'), 0);
  const out = new THREE.Vector3(p0.x, 0, p0.z), n0 = new THREE.Vector3().fromBufferAttribute(nrm, 0);
  if (n0.dot(out) < 0) { const arr = g.index.array; for (let i = 0; i < arr.length; i += 3) { const t = arr[i + 1]; arr[i + 1] = arr[i + 2]; arr[i + 2] = t; } g.computeVertexNormals(); }
  return g;
}

// ---------- scene ----------
const view = document.getElementById('view'), err = document.getElementById('err');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { err.textContent = 'WebGL is not available in this browser, so the 3D view cannot start.'; err.style.display = 'block'; }
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(32, 1, 1, 5000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a948a, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(-0.6, 1, 0.35); camera.add(key); scene.add(camera);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(1, 0.6, 0.4); scene.add(fill);
const mat = new THREE.MeshStandardMaterial({ color: cssVar('--blade'), roughness: 0.5, metalness: 0.15 });
const lineMat = new THREE.LineBasicMaterial({ color: cssVar('--edge'), transparent: true, opacity: 0.7 });
const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat), rings = new THREE.Group();
scene.add(mesh, rings);
let controls;
if (renderer) {
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); view.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
  new ResizeObserver(resize).observe(view);
}
const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
function resize() {
  const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  // offset the camera so the blade centres in the part of the view the panel leaves free
  const r = panel.getBoundingClientRect(), mobile = innerWidth <= 720;
  camera.setViewOffset(w, h, mobile ? 0 : -r.right / 2, mobile && panel.classList.contains('open') ? r.height / 2 : 0, w, h);
}
toggle.onclick = () => { const o = panel.classList.toggle('open'); toggle.setAttribute('aria-expanded', o); toggle.textContent = o ? 'Close' : 'Controls'; resize(); };
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function rebuild() {
  const secs = sections();
  mesh.geometry.dispose(); mesh.geometry = bladeGeometry(secs);
  rings.clear();
  secs.forEach((s, k) => {
    if (k % 5 && k !== K - 1) return;
    const g = new THREE.BufferGeometry().setFromPoints(s.ring.map(([x, z]) => new THREE.Vector3(x, s.y + 0.05, z)));
    rings.add(new THREE.LineLoop(g, lineMat));
  });
  rings.visible = document.getElementById('rings').checked;
  drawSection(secs[0]); readouts(secs);
}
function fit() {
  const box = new THREE.Box3().setFromObject(mesh), c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const d = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.position.copy(c).add(new THREE.Vector3(0.7, 0.35, 1).normalize().multiplyScalar(d));
  camera.near = d / 100; camera.far = d * 10; camera.updateProjectionMatrix();
  if (controls) { controls.target.copy(c); controls.update(); }
}

// ---------- the section inset (root section and its camber line) ----------
function drawSection(s) {
  const xs = s.ring.map((p) => p[0]), zs = s.ring.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
  const k = Math.min(240 / (maxX - minX), 84 / (maxZ - minZ)), ox = 134 - k * (minX + maxX) / 2, oz = 55 + k * (minZ + maxZ) / 2;
  const path = (pts, close) => pts.map(([x, z], i) => (i ? 'L' : 'M') + (ox + k * x).toFixed(1) + ' ' + (oz - k * z).toFixed(1)).join(' ') + (close ? ' Z' : '');
  document.getElementById('section').innerHTML =
    `<path d="${path(s.ring, true)}" fill="${cssVar('--blade')}" fill-opacity=".85" stroke="${cssVar('--edge')}" stroke-width="1.2"/>` +
    `<path d="${path(s.camber, false)}" fill="none" stroke="${cssVar('--edge')}" stroke-width="1" stroke-dasharray="4 3"/>`;
}

// ---------- readouts ----------
function readouts(secs) {
  const tip = secs[K - 1], f = (v, d = 1) => v.toFixed(d);
  document.getElementById('meta').innerHTML = [
    ['Root chord', `${CHORD} mm`], ['Tip chord', `${f(CHORD * P.taper / 100)} mm`], ['Span', `${f(P.span * CHORD)} mm`],
    ['Max thickness at root', `${f(P.thick / 100 * CHORD)} mm`], ['Camber height at root', `${f(secs[0].sagitta)} mm`],
    ['Tip turned by', `${P.twist}°`], ['Sections', `${K}`], ['Triangles', `${mesh.geometry.index.count / 3}`],
  ].map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join('');
}

// ---------- controls ----------
const sliders = document.getElementById('sliders');
PARAMS.forEach((p) => {
  const row = document.createElement('div'); row.className = 'ctl';
  row.innerHTML = `<label class="lbl" for="p-${p.k}"><span>${p.label}</span><b id="v-${p.k}"></b></label>
    <input type="range" id="p-${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.def}">`;
  sliders.appendChild(row);
  const inp = row.querySelector('input'), val = row.querySelector('b');
  const show = () => { val.textContent = `${inp.value} ${p.unit}`; };
  inp.addEventListener('input', () => { P[p.k] = +inp.value; show(); rebuild(); });
  show();
});
document.getElementById('rings').addEventListener('change', (e) => { rings.visible = e.target.checked; });
document.getElementById('fit').onclick = fit;
document.getElementById('reset').onclick = () => {
  PARAMS.forEach((p) => { P[p.k] = p.def; const inp = document.getElementById('p-' + p.k); inp.value = p.def; inp.dispatchEvent(new Event('input')); });
  fit();
};

rebuild(); fit();
drawQR(document.getElementById('qr'));
window.BladeShape = { P, rebuild, mesh };            // for scripts and tests
if (renderer) (function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
